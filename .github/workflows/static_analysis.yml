name: Firmware Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  esp32-analysis:
    name: ESP32 Firmware Check
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: |
          apt-get update
          apt-get install -y cppcheck clang-tidy
          
      - name: Mock micro-ROS for Analysis
        working-directory: ./firmware
        run: |
          mkdir -p components/micro_ros_espidf_component/build
          touch components/micro_ros_espidf_component/libmicroros.a
          mkdir -p components/micro_ros_espidf_component/include
          
      - name: Build Compilation Database          
        working-directory: ./firmware
        run: |
          # Fix ownership
          git config --global --add safe.directory /__w/fastbot_advanced/fastbot_advanced
          . $IDF_PATH/export.sh
          idf.py reconfigure

      - name: Run Linting Suite
        working-directory: ./firmware
        run: |
          # Source environment so xtensa-esp32-elf-gcc is found by Makefile
          . $IDF_PATH/export.sh
          make lint
