services:
  micro-ros-agent:
    image: microros/micro-ros-agent:jazzy
    container_name: micro-ros-agent
    privileged: true
    network_mode: host
    restart: always
    attach: false
    environment:
      ROS_DOMAIN_ID: 0
    devices:
      - /dev/ttyUSB0:/dev/esp32
    command: serial --dev /dev/esp32 --baudrate 921600 -v4 --restart_transport true --rs

  fastbot-ros2-slam:
    build:
        context: ..
        dockerfile: docker/Dockerfile.slam
    image: fastbot-ros2-slam
    container_name: fastbot-ros2-slam
    privileged: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: 0
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /fastdds_profile.xml
    volumes:
      - /dev/joy:/dev/joy
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - ../slam/recordings/:/ros2_ws/recordings/
    entrypoint: /ros_entrypoint.sh
    command: ros2 launch stella_vslam_ros oakd_vslam.launch.py 

